{% extends "base.html" %}
{% block title %}Login - LeaveOk{% endblock %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>
  </form>
  {% if unverified_email %}
  <form method="POST" action="{{ url_for('auth.resend_verification') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="email" value="{{ unverified_email }}">
    <button type="submit">Resend verification email</button>
  </form>
  {% endif %}
  <p class="muted">New organization? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  <p class="muted"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
</div>
{% endblock %}
